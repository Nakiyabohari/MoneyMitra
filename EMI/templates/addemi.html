{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>EMI Manager</title>

    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/addemi.css' %}">
    <link rel="stylesheet" href="{% static 'css/dark2.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!-- 🔥 BACKGROUND IMAGE -->
    <img src="{% static 'images/bg.png' %}" class="bg-image">

<div class="container">

    <!-- Header -->
    <div class="header">
        <a href="{% url 'emimanager' %}" class="circle-btn"> ← </a>
        <h2>Add EMI</h2>
    </div>

    <!-- Alert Message -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert-box {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Total EMI Card -->
    <div class="total-card">
        <p>Total Monthly EMI</p>
        <h1>₹{{ total|floatformat:0 }}</h1>
    </div>

    <!-- Form Section -->
    <div class="form-card">
        <h3>Add New EMI</h3>

        <form method="post">
            {% csrf_token %}

            <label>EMI Name</label>
            {{ e.emi_name }}

            <div class="double-field">
                <div>
                    <label>Monthly Amount</label>
                    {{ e.monthly_amount }}
                </div>
                <div>
                    <label>Duration (months)</label>
                    {{ e.duration }}
                </div>
            </div>

            <label>Start Date</label>
            {{ e.start_date }}

            <label>End Date</label>
            {{ e.end_date }}

            <button type="submit" class="btn">Add EMI</button>
        </form>
    </div>

</div>

<script src="{% static 'js/menu.js' %}"></script>
<script src="{% static 'js/addemi.js' %}"></script>

<!-- Auto hide alert -->
<script>
    setTimeout(() => {
        const alert = document.querySelector('.alert-box');
        if (alert) {
            alert.style.display = 'none';
        }
    }, 3000);
</script>

</body>
</html>
