{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>EMI Manager</title>
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/addemi.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <a href="{% url 'emimanager' %}" class="circle-btn"> ← </a>
        <h2>Add EMI</h2>
    </div>

    <!-- Total EMI Card -->
    <div class="total-card">
    <p>Total Monthly EMI</p>
    <h1>₹{{ total|floatformat:0 }}</h1>
</div>

    <!-- Form Section -->
    <div class="form-card">
        <h3>Add New EMI</h3>

        <form method="post">
            {% csrf_token %}

            <label>EMI Name</label>
            {{ e.emi_name }}

            <div class="double-field">
                <div>
                    <label>Monthly Amount</label>
                    {{ e.monthly_amount }}
                </div>
                <div>
                    <label>Duration (months)</label>
                    {{ e.duration }}
                </div>
            </div>

            <label>Start Date</label>
            {{ e.start_date }}

            <label>End Date</label>
            {{ e.end_date }}

            <button type="submit" class="btn">Add EMI</button>
        </form>

    </div>

</div>

</body>
</html>
