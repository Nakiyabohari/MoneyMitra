{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Investments - MoneyMitra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/investment-desktop.css' %}">
    <link rel="stylesheet" href="{% static 'css/investment-mobile.css' %}" media="(max-width: 768px)">
</head>

<body>
    <div class="main-wrapper">
        <div class="main-card">

            <!-- LEFT SECTION -->
            <div class="left-section">

                <!-- Header -->
                <div class="page-header">
                    <button class="back-btn" onclick="goBack()">&#8592;</button>
                    <h2>Investment Planning</h2>
                </div>

                <p class="info-text">
                    Investing regularly helps your money grow over time.
                    Start small and increase gradually.
                </p>

                <h3>Choose Investment Type</h3>

                <div class="investment-types">
                    <div class="invest-card active"
                         onclick="selectType('Mutual Funds', this)">
                        <h4>Mutual Funds</h4>
                        <p>Diversified portfolio</p>
                    </div>

                    <div class="invest-card"
                         onclick="selectType('ETFs', this)">
                        <h4>ETFs</h4>
                        <p>Index tracking</p>
                    </div>
                </div>

                <div class="amount-card">
                    <p>Monthly Investment Amount</p>
                    <div class="amount-input">
                        ₹ <input type="number">
                    </div>
                </div>

                <button class="outline-btn" onclick="toggleMitraChat()">
                    ✨ Ask Mitra AI
                </button>

                <button class="btn">
                    Save Investment Plan
                </button>

            </div>

            <!-- RIGHT SECTION (CHAT) -->
            <div class="right-section">

                <div class="mitra-header">
                    MoneyMitra AI
                    <span onclick="closeMitraChat()">✕</span>
                </div>

                <div id="chatBox" class="mitra-chatbox"></div>

                <div class="mitra-input-area">
                    <input type="text"
                           id="chatInput"
                           placeholder="Ask about investments...">

                    <button type="button"
                            onclick="sendChatMessage()">
                        Send
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script src="{% static 'js/investment.js' %}"></script>

    <script>
        function goBack() {
            window.history.back();
        }

        function toggleMitraChat() {
            if (window.innerWidth <= 768) {
                document
                    .querySelector(".right-section")
                    .classList.add("show-chat");
            }
        }

        function closeMitraChat() {
            document
                .querySelector(".right-section")
                .classList.remove("show-chat");
        }
    </script>
</body>
</html>
