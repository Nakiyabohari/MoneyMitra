{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMitra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/global.css' %}">
<link rel="stylesheet" href="{% static 'css/welcome.css' %}">
</head>

<body class="welcome-body">

<div class="screen">

    <div class="hero">

        <!-- ================= LEFT SIDE ================= -->
        <div class="hero-left">

            <!-- Logo -->
            <div class="logo">
                <img src="{% static 'images/logo3.png' %}" alt="MoneyMitra Logo">
            </div>

            <!-- Title -->
            <h1>MoneyMitra</h1>

            <!-- Tagline -->
            <p class="tagline">
                Manage your money,<br>
                stress free
            </p>

            <!-- Features -->
            <div class="features">

                <div class="feature">
                    <span class="tick">✓</span>
                    <div>
                        <strong>Smart Budget Tracking</strong>
                        <small>Track expenses effortlessly</small>
                    </div>
                </div>

                <div class="feature">
                    <span class="tick">✓</span>
                    <div>
                        <strong>Detailed Analytics</strong>
                        <small>Visualize spending patterns</small>
                    </div>
                </div>

                <div class="feature">
                    <span class="tick">✓</span>
                    <div>
                        <strong>Secure & Private</strong>
                        <small>Your data stays protected</small>
                    </div>
                </div>

            </div>

            <!-- Button -->
            <a href="{% url 'login' %}">
                <button class="cta">Get Started →</button>
            </a>

            <!-- Trust Text -->
            <p class="trusted">
                Trusted by 10,000+ students and young professionals
            </p>

        </div>


        <!-- ================= RIGHT SIDE ================= -->
        <div class="hero-right">

            <div class="illustration-box">
                <img src="{% static 'images/image2.jpeg' %}" alt="Finance Illustration">
            </div>

        </div>

    </div>

</div>
</body>
</html>
