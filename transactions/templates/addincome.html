{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'css/addincome.css' %}">
<link rel="stylesheet" href="{% static 'dark/addincome.css' %}">
<title>Add Income</title>
</head>

<body>

<div class="page-wrapper">
<div class="container">

<div class="header">
    <div class="back-btn" onclick="history.back()">←</div>
    <h2>Add Income</h2>
</div>

<div class="amount-card">
    <small>Income Amount</small>
    <h1 id="displayAmount">₹0</h1>
</div>

<form id="incomeForm" method="POST">
{% csrf_token %}

<label>Amount</label>
<input 
type="number"
id="amountInput"
name="amount"
placeholder="₹ 0.00"
step="0.01"
min="0"
max="10000000"
required>

<label>Income Source</label>

<div id="sourceWrapper">

    <select id="incomeSourceSelect" name="income_source" onchange="handleSourceChange()" required>
        <option value="">Select Income Source</option>
        <option value="Salary">Salary</option>
        <option value="Freelancing">Freelancing</option>
        <option value="Business">Business</option>
        <option value="Other">➕ Custom Source</option>
    </select>

    <input
        type="text"
        id="customSourceInput"
        name="custom_income_source"
        placeholder="Enter custom income source"
        class="hidden"
        onkeydown="handleCustomEnter(event)"
        onblur="finalizeCustomSource()"
    >

</div>


<label>Payment Method</label>
<select name="payment_method" required>
    <option value="">Select Payment Method</option>
    <option value="Cash">Cash</option>
    <option value="UPI">UPI</option>
    <option value="Bank Transfer">Bank Transfer</option>
    <option value="Card">Card</option>
</select>

<!-- 🔥 ADD THIS DATE FIELD HERE -->
<label>Date</label>
<input type="date" name="date" required>

<button type="submit">Save Income</button>


</form>

</div>
</div>

<script src="{% static 'js/addincome.js' %}"></script>
<script src="{% static 'js/menu.js' %}"></script>
</body>
</html>
