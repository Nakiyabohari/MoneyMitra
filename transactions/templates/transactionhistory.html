{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Transaction History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{% static 'css/transactions_history.css' %}">

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="app-header">
<a href="{% url 'dashboard' %}" class="back-btn">←</a>
<h2>Transaction History</h2>
</div>


<!-- SUMMARY -->

<div class="summary-section">

<div class="summary-card income-card">
<p>↙ Income</p>
<h3>₹{{ total_income }}</h3>
</div>

<div class="summary-card expense-card">
<p>↗ Expenses</p>
<h3>₹{{ total_expense }}</h3>
</div>

</div>


<!-- SEARCH -->

<div class="search-box">
<span>🔍</span>
<input type="text" id="search" placeholder="Search transactions...">
</div>


<!-- FILTER -->

<div class="filter-section">

<select id="typeFilter">
<option value="all">All Types</option>
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

</div>


<!-- TRANSACTIONS -->

<div class="transaction-scroll">
<div id="transactionList"></div>
</div>

</div>

{{ transactions|json_script:"transactions-data" }}

<script src="{% static 'js/transactions_history.js' %}"></script>

</body>
</html>
