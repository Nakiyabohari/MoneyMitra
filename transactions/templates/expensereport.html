{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Reports</title>
<link rel="stylesheet" href="{% static 'css/expensereport.css' %}">
<link rel="stylesheet" href="{% static 'css/global.css' %}">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>

<div class="container">
  
  <h2 style="display:flex; align-items:center; justify-content:center; gap:10px; position:relative;">
    <span onclick="goBack()" style="position:absolute; left:0; cursor:pointer; font-size:20px;">←</span>
    Expense Reports
  </h2>

  <div class="section-title">Select Period</div>
  <div class="select-group">

    <!-- Month Dropdown (Auto Generated) -->
    <select id="month"></select>

    <!-- Year Dropdown (Auto Generated) -->
    <select id="year"></select>

  </div>

  <div class="button-group">
    <button class="btn download" onclick="downloadPDF()">Download</button>
    <button class="btn share" onclick="shareReport()">Share</button>
  </div>

  <div class="card income">
    <h3>Income Summary</h3>
    <div class="row"><span>Monthly Salary</span><span id="salary">₹7,67,67,678</span></div>
    <div class="row"><span>Other Income</span><span>₹0</span></div>
    <div class="row total"><span>Total Income</span><span>₹7,67,67,678</span></div>
  </div>

  <div class="card expense">
    <h3>Expense Summary</h3>
    <div class="row"><span>Total Expenses</span><span>₹0</span></div>
    <div class="row"><span>Savings Goal</span><span>₹0</span></div>
    <div class="row"><span>Investments</span><span>₹0</span></div>
    <div class="row"><span>EMI Payments</span><span>₹0</span></div>
  </div>

  <div class="card balance">
    <div>Net Balance</div>
    <div class="big-amount">₹7,67,67,678</div>
    <div>Surplus</div>
  </div>

  <div class="card transactions">
    <div>Total Transactions</div>
    <div class="big-amount">0</div>
  </div>

</div>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
/* ===============================
   AUTO GENERATE MONTHS
================================= */

const monthSelect = document.getElementById("month");
const months = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

months.forEach((month, index) => {
  const option = document.createElement("option");
  option.value = index + 1;
  option.textContent = month;

  if (index === new Date().getMonth()) {
    option.selected = true;
  }

  monthSelect.appendChild(option);
});


/* ===============================
   AUTO GENERATE YEARS
================================= */

const yearSelect = document.getElementById("year");
const currentYear = new Date().getFullYear();

for (let i = currentYear - 10; i <= currentYear + 5; i++) {
  const option = document.createElement("option");
  option.value = i;
  option.textContent = i;

  if (i === currentYear) {
    option.selected = true;
  }

  yearSelect.appendChild(option);
}


/* ===============================
   SHARE FUNCTION
================================= */

function shareReport() {

  const container = document.querySelector(".container");

  html2canvas(container).then(canvas => {
    canvas.toBlob(blob => {

      const file = new File([blob], "Expense_Report.png", { type: "image/png" });

      if (navigator.share) {
        navigator.share({
          title: "Expense Report",
          text: "Here is my expense report.",
          files: [file]
        }).catch(error => console.log(error));
      } else {
        alert("Sharing is not supported on this browser. Please use mobile.");
      }

    });
  });

}


/* ===============================
   GO BACK FUNCTION
================================= */

function goBack() {
  window.history.back();
}

</script>

</body>
</html>
