{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'css/add_expense.css' %}">
<title>Add Expense</title>
</head>

<body>

<div class="card">

<form method="POST">
{% csrf_token %}

    <!-- Header -->
    <div class="header">
        <div class="back-btn" onclick="history.back()">←</div>
        <div class="title">Add Expense</div>
    </div>

    <!-- Amount -->
    <label>Amount</label>
    <div class="input-box">
        <span class="icon">₹</span>
        <input type="number" name="expense_amount" placeholder="0.00" step="0.01" required>
    </div>

    <!-- Category -->
    <label>Category</label>
    <div class="field hoverable">
        <select id="categorySelect" name="category" onchange="handleCategoryChange()" required>
            <option value="">Select Category</option>
            <option value="Shopping">Shopping</option>
            <option value="Food">Food</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="custom">➕ Custom Category</option>
        </select>
    </div>

    <!-- Custom Category Input (Hidden by default) -->
    <div class="field hoverable hidden" id="categoryInputBox">
        <input
            type="text"
            id="categoryInput"
            placeholder="Enter custom category"
            onkeydown="handleCustomEnter(event)"
            onblur="finalizeCustomCategory()"
        >
    </div>

    <!-- Optional Custom Category Field -->
    <label>If Other, Enter Custom Category</label>
    <div class="input-box">
        <input
            type="text"
            name="custom_category"
            placeholder="Enter custom category (optional)">
    </div>

    <!-- Date -->
    <label>Date</label>
    <div class="input-box">
        <span class="icon">📅</span>
        <input type="date" name="date" required>
    </div>

    <!-- Payment -->
    <label>Payment Type</label>
    <div class="input-box">
        <select name="expense_payment_method" required>
            <option value="">Select Payment Type</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Net Banking">Net Banking</option>
        </select>
    </div>

    <!-- Notes -->
    <label>Notes (Optional)</label>
    <div class="input-box">
        <textarea name="notes" placeholder="Write a note..."></textarea>
    </div>

    <button type="submit">Save Expense</button>

</form>
</div>

<script src="{% static 'js/add_expense.js' %}"></script>

</body>
</html>
